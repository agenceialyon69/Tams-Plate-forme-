name: Dev Agent Sandbox Validation

on:
  workflow_dispatch:
    inputs:
      run_kind:
        description: Validation kind
        required: true
        default: full_validation
        type: choice
        options:
          - full_validation
          - typecheck
          - e2e_playwright

jobs:
  sandbox-validation:
    name: Safe worker sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tams
          POSTGRES_PASSWORD: tams
          POSTGRES_DB: tams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tams:tams@localhost:5432/tams_test
      BASE_PATH: /
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare package manager
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile --lockfile=false
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build frontend
        if: ${{ inputs.run_kind == 'full_validation' || inputs.run_kind == 'e2e_playwright' }}
        run: BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/tams run build
      - name: Build API
        if: ${{ inputs.run_kind == 'full_validation' || inputs.run_kind == 'e2e_playwright' }}
        run: pnpm --filter @workspace/api-server run build
      - name: Runtime tests
        if: ${{ inputs.run_kind == 'full_validation' }}
        run: pnpm --filter @workspace/scripts test
      - name: Runtime scenario
        if: ${{ inputs.run_kind == 'full_validation' }}
        run: pnpm --filter @workspace/scripts dev-runtime:scenario
      - name: Install browser
        if: ${{ inputs.run_kind == 'e2e_playwright' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Start app for e2e
        if: ${{ inputs.run_kind == 'e2e_playwright' }}
        run: |
          NODE_ENV=production PORT=4000 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/healthz >/dev/null && break; sleep 1; done
      - name: Browser E2E operator
        if: ${{ inputs.run_kind == 'e2e_playwright' }}
        run: E2E_BASE_URL=http://127.0.0.1:4000 pnpm run e2e
