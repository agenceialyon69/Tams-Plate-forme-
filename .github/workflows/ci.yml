name: CI — invariants, build & smoke (garde-fou déploiement)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tams
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - name: Build
        run: |
          BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/tams run build
          pnpm --filter @workspace/api-server run build
      - run: pnpm run typecheck
      - name: Runtime tests
        run: |
          pnpm --filter @workspace/scripts test
          pnpm --filter @workspace/scripts dev-runtime:scenario
          pnpm --filter @workspace/scripts dev-runtime:mission2
          pnpm --filter @workspace/scripts life-os:scenarios
          grep -q '"verdict": "PASS"' life-os-scenarios-report.json
          pnpm --filter @workspace/scripts dev-agent:benchmark -- --smoke
          grep -q '"verdict": "PASS"' dev-agent-benchmark-report.json
      - name: Smoke provider, recovery, Life OS and Dev Agent Pro bridges
        run: |
          NODE_ENV=production PORT=4000 node ./artifacts/api-server/dist/index.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/healthz >/dev/null && break; sleep 1; done
          capabilities=$(curl -sf http://127.0.0.1:4000/api/registry/capabilities)
          echo "$capabilities" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s).capabilities;for(const id of ["video.generate","search.web","audio.music.generate","voice.transcribe","audio.synthesize","automation.workflow"]){const x=c.find(v=>v.id===id);if(!x||x.status!=="available")process.exit(1)}})'
          search=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"capabilityId":"search.web","input":"TAMS"}' http://127.0.0.1:4000/api/capabilities/execute)
          echo "$search" | grep -q '"status":"success"'
          curl -sf http://127.0.0.1:4000/api/system/recovery/status | grep -q 'append_only_v1'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"version":"1.0","data":{"tasks":[{"title":"Test recovery"}],"projects":[],"memories":[],"decisions":[]}}' http://127.0.0.1:4000/api/system/recovery/validate | grep -q '"ok":true'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"mode":"dry_run","payload":{"version":"1.0","data":{"tasks":[{"title":"Test recovery"}],"projects":[],"memories":[],"decisions":[]}}}' http://127.0.0.1:4000/api/system/recovery/import | grep -q '"mode":"dry_run"'
          curl -sf http://127.0.0.1:4000/api/life-os/status | grep -q 'life_os_v5_foundation'
          curl -sf http://127.0.0.1:4000/api/life-os/v5/cockpit | grep -q 'Life\|life_os_v5_foundation'
          curl -sf http://127.0.0.1:4000/api/life-os/v5/risk-radar | grep -q 'riskRadar'
          curl -sf http://127.0.0.1:4000/api/life-os/v5/plan | grep -q 'nextActions'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"text":"J’ai une facture urgente et je suis fatigué","persist":false}' http://127.0.0.1:4000/api/life-os/v5/capture | grep -q 'admin_finance\|health'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"decision":"Dois-je prendre une grosse décision projet cette semaine ?","energy":40,"urgency":50}' http://127.0.0.1:4000/api/life-os/v5/red-team | grep -q 'redFlags'
          curl -sf http://127.0.0.1:4000/api/permissions/actions | grep -q 'email.send'
          curl -sf http://127.0.0.1:4000/api/jobs | grep -q '"jobs"'
          curl -sf http://127.0.0.1:4000/api/life-os/history/timeline | grep -q '"timeline"'
          curl -sf http://127.0.0.1:4000/api/memory-graph/v2 | grep -q '"nodes"'
          curl -sf http://127.0.0.1:4000/api/life-os/automations | grep -q 'Daily Life Briefing'
          curl -sf http://127.0.0.1:4000/api/life-os/integrations/gmail/status | grep -q '"status":"missing_config"'
          curl -sf http://127.0.0.1:4000/api/life-os/integrations/calendar/status | grep -q '"status":"missing_config"'
          coach=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"prompt":"Je suis fatigué mais je veux lancer trois projets","energy":25}' http://127.0.0.1:4000/api/life-os/coach)
          echo "$coach" | grep -q '"factsKnown"'
          echo "$coach" | grep -q '"assumptions"'
          echo "$coach" | grep -q '"recommendation"'
          echo "$coach" | grep -q '"sources"'
          echo "$coach" | grep -q '"limits"'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"prompt":"Dois-je accélérer mon projet malgré ma fatigue ?","energy":20}' http://127.0.0.1:4000/api/life-os/coach/red-team | grep -q '"redTeamCounterArguments"'
          job=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"type":"manual","input":{"scenario":"ci"},"dryRun":true}' http://127.0.0.1:4000/api/jobs)
          job_id=$(echo "$job" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).job.id))')
          curl -sf "http://127.0.0.1:4000/api/jobs/$job_id" | grep -q "$job_id"
          curl -sf "http://127.0.0.1:4000/api/jobs/$job_id/logs" | grep -q '"logs"'
          curl -sf http://127.0.0.1:4000/api/ops/status | grep -q '"secretsExposed":false'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/status | grep -q 'dev_agent_pro_v5_foundation'
          sandbox=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"mission":"ci smoke","mode":"dry_run"}' http://127.0.0.1:4000/api/dev-agent/pro/sandbox)
          sandbox_id=$(echo "$sandbox" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).sandbox.id))')
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"command":"git status","dryRun":true}' "http://127.0.0.1:4000/api/dev-agent/pro/sandbox/$sandbox_id/command" | grep -q '"status":"success"'
          curl -s -o /tmp/blocked.txt -w "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{"command":"rm -rf /","dryRun":true}' "http://127.0.0.1:4000/api/dev-agent/pro/sandbox/$sandbox_id/command" | grep -q '403'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/repo-index/status | grep -q 'indexed'
          curl -sf 'http://127.0.0.1:4000/api/dev-agent/pro/repo-index/search?q=life-os%20coach' | grep -q 'life-os'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/plugins | grep -q 'shell-sandbox'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/subagents | grep -q 'Reviewer Agent'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/diff | grep -q 'empty_state'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/benchmark | grep -q '30'
          curl -sf http://127.0.0.1:4000/api/dev-agent/pro/sessions | grep -q 'sessions'
          plan=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"title":"ci plan","commands":["pnpm run typecheck"]}' http://127.0.0.1:4000/api/dev-agent/pro/command-plan)
          plan_id=$(echo "$plan" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).plan.id))')
          curl -sf -X POST "http://127.0.0.1:4000/api/dev-agent/pro/command-plan/$plan_id/run" | grep -q '"status":"success"'
          # Recherche web sourcée (Mon Agent) : l'intent "research" doit router vers
          # research_source_based sans crasher. Réseau/LLM peuvent manquer en CI : on
          # valide le CONTRAT, pas la couverture. Même step = serveur 4000 encore vivant.
          research=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"message":"recherche intelligence artificielle open source"}' http://127.0.0.1:4000/api/operator/chat)
          echo "$research" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s);const r=b.reply||b;if(r.intent!=="research")process.exit(1);if(r.capabilityId!=="research_source_based")process.exit(1);if(!["completed","blocked","failed"].includes(r.executionStatus))process.exit(1);console.log("research OK:",r.executionStatus,"sources:",Array.isArray(r.evidence)?r.evidence.length:0)})'
          # Capture Telegram NON configurée (pas de secret sur ce serveur) => 503 honnête.
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"text":"x"}' http://127.0.0.1:4000/api/integrations/telegram-capture | grep -q '503'
          # Code operator (lecture seule) : pas de GITHUB_TOKEN en CI => 503 missing_config + validation.
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4000/api/code/file?path=README.md' | grep -q '503'
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4000/api/code/file' | grep -q '400'
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4000/api/code/tree' | grep -q '503'
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4000/api/code/search?q=searchWeb' | grep -q '503'
          curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4000/api/code/search' | grep -q '400'
          # Code operator ÉCRITURE (garde-fous, flag off + pas de token ici) : main => 400, branche valide => 403.
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"branch":"main","files":[{"path":"a","content":"b"}]}' http://127.0.0.1:4000/api/code/propose | grep -q '400'
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"branch":"feat/x","files":[{"path":"a","content":"b"}]}' http://127.0.0.1:4000/api/code/propose | grep -q '403'
          # Boucle autonome : instruction de modif => intent github_code + confirmation ; sans token => blocked (honnête).
          chg=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"message":"modifie artifacts/api-server/src/app.ts pour ajouter un commentaire"}' http://127.0.0.1:4000/api/operator/chat)
          echo "$chg" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s);const r=b.reply||b;if(r.intent!=="github_code")process.exit(1);if(r.capabilityId!=="github_pr_create_confirmed")process.exit(1);if(!["blocked","completed","failed"].includes(r.executionStatus))process.exit(1);console.log("code-loop OK:",r.executionStatus)})'
      - name: Smoke Personal Admin Access Gate (privé quand activé)
        run: |
          # Génère un vrai hash scrypt (chemin recommandé) → prouve générateur + vérif.
          HASH=$(node scripts/hash-admin-password.mjs 'ci-secret-pw')
          TAMS_PERSONAL_ACCESS_ENABLED=true \
          TAMS_ADMIN_EMAIL=admin@tams.local \
          TAMS_ADMIN_PASSWORD_HASH="$HASH" \
          TAMS_SESSION_SECRET=ci-secret-key-long-enough-1234567890 \
          TAMS_TELEGRAM_CAPTURE_SECRET=ci-capture-secret \
          NODE_ENV=production PORT=4002 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-gate.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4002/api/healthz >/dev/null && break; sleep 1; done
          # /api/healthz reste public malgré le gate
          curl -sf http://127.0.0.1:4002/api/healthz >/dev/null
          # page de login admin accessible
          curl -sf http://127.0.0.1:4002/personal-access | grep -q 'Accès admin'
          # sans session : /mon-agent redirige (302) vers /personal-access
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4002/mon-agent | grep -q '302'
          # sans session : /api/operator/* renvoie 401
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4002/api/operator/readiness | grep -q '401'
          # mauvais mot de passe -> 401
          curl -s -o /dev/null -w '%{http_code}' -X POST -d 'email=admin@tams.local&password=wrong' http://127.0.0.1:4002/personal-access | grep -q '401'
          # mauvais email -> 401
          curl -s -o /dev/null -w '%{http_code}' -X POST -d 'email=intrus@tams.local&password=ci-secret-pw' http://127.0.0.1:4002/personal-access | grep -q '401'
          # login correct (email + hash) -> Set-Cookie HttpOnly, cookie stocké
          curl -s -c /tmp/gate-cookie.txt -o /dev/null -D /tmp/gate-headers.txt -X POST -d 'email=admin@tams.local&password=ci-secret-pw' http://127.0.0.1:4002/personal-access
          grep -qi 'set-cookie: *tams_admin_session' /tmp/gate-headers.txt
          grep -qi 'httponly' /tmp/gate-headers.txt
          grep -qi 'samesite=strict' /tmp/gate-headers.txt
          # avec session : /api/operator/readiness n'est plus 401
          test "$(curl -s -b /tmp/gate-cookie.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:4002/api/operator/readiness)" != "401"
          # logout -> 302 (efface le cookie)
          curl -s -o /dev/null -w '%{http_code}' -b /tmp/gate-cookie.txt -X POST http://127.0.0.1:4002/personal-access/logout | grep -q '302'
          # Capture Telegram : exemptée du gate par son secret partagé.
          # mauvais secret -> 401
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-tams-capture-secret: WRONG' -H 'Content-Type: application/json' -d '{"text":"x"}' http://127.0.0.1:4002/api/integrations/telegram-capture | grep -q '401'
          # bon secret + texte -> stocké (ok:true, DB up en CI)
          cap=$(curl -s -X POST -H 'x-tams-capture-secret: ci-capture-secret' -H 'Content-Type: application/json' -d '{"text":"note capturee en CI"}' http://127.0.0.1:4002/api/integrations/telegram-capture)
          echo "$cap" | grep -q '"ok":true'
          echo "$cap" | grep -q '"type":"memory"'
          # aucun secret loggé
          if grep -Eq 'ci-secret-pw|ci-secret-key-long-enough|ci-capture-secret' /tmp/tams-gate.log; then echo 'SECRET LEAK in logs'; exit 1; fi
      - name: Smoke gate — replis de config (JWT_SECRET + mot de passe legacy)
        run: |
          # Config "rétro-compat" : PAS de TAMS_SESSION_SECRET (repli JWT_SECRET),
          # PAS de TAMS_ADMIN_PASSWORD_HASH (mot de passe via ancienne variable).
          # Le gate doit être opérationnel (login OK), pas fail-closed à tort.
          TAMS_PERSONAL_ACCESS_ENABLED=true \
          TAMS_ADMIN_EMAIL=admin@tams.local \
          TAMS_PERSONAL_ACCESS_PASSWORD=legacy-pw \
          JWT_SECRET=legacy-jwt-secret-long-enough-000000 \
          NODE_ENV=production PORT=4003 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-gate2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4003/api/healthz >/dev/null && break; sleep 1; done
          # login page servie (pas de 503 fail-closed)
          curl -sf http://127.0.0.1:4003/personal-access | grep -q 'Accès admin'
          # mauvais mot de passe -> 401 (config bien reconnue)
          curl -s -o /dev/null -w '%{http_code}' -X POST -d 'email=admin@tams.local&password=nope' http://127.0.0.1:4003/personal-access | grep -q '401'
          # login via mot de passe legacy + secret JWT de repli -> cookie posé
          curl -s -c /tmp/g2.txt -o /dev/null -D /tmp/g2h.txt -X POST -d 'email=admin@tams.local&password=legacy-pw' http://127.0.0.1:4003/personal-access
          grep -qi 'set-cookie: *tams_admin_session' /tmp/g2h.txt
          test "$(curl -s -b /tmp/g2.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:4003/api/operator/readiness)" != "401"
      - name: Smoke code operator écriture — 503 sans token (flag on)
        run: |
          # Flag d'écriture ON mais AUCUN GITHUB_TOKEN => 503 (token requis pour écrire).
          TAMS_DEV_AGENT_PR_WRITE=true NODE_ENV=production PORT=4030 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-cw.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4030/api/healthz >/dev/null && break; sleep 1; done
          curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"branch":"feat/x","files":[{"path":"a","content":"b"}]}' http://127.0.0.1:4030/api/code/propose | grep -q '503'
      - name: E2E navigateur
        run: |
          pnpm exec playwright install --with-deps chromium
          NODE_ENV=production PORT=4001 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4001/api/healthz >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://127.0.0.1:4001 pnpm run e2e
