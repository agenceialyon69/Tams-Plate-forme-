name: CI — invariants, build & smoke (garde-fou déploiement)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tams
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - name: Build
        run: |
          BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/tams run build
          pnpm --filter @workspace/api-server run build
      - run: pnpm run typecheck
      - name: Runtime tests
        run: |
          pnpm --filter @workspace/scripts test
          pnpm --filter @workspace/scripts dev-runtime:scenario
          pnpm --filter @workspace/scripts dev-runtime:mission2
      - name: Smoke provider bridges
        run: |
          NODE_ENV=production PORT=4000 node ./artifacts/api-server/dist/index.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/healthz >/dev/null && break; sleep 1; done
          capabilities=$(curl -sf http://127.0.0.1:4000/api/registry/capabilities)
          echo "$capabilities" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s).capabilities;for(const id of ["video.generate","search.web","audio.music.generate","voice.transcribe","audio.synthesize","automation.workflow"]){const x=c.find(v=>v.id===id);if(!x||x.status!=="available")process.exit(1)}})'
          search=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"capabilityId":"search.web","input":"TAMS"}' http://127.0.0.1:4000/api/capabilities/execute)
          echo "$search" | grep -q '"status":"success"'
      - name: E2E navigateur
        run: |
          pnpm exec playwright install --with-deps chromium
          NODE_ENV=production PORT=4001 node ./artifacts/api-server/dist/index.mjs > /tmp/tams-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4001/api/healthz >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://127.0.0.1:4001 pnpm run e2e
